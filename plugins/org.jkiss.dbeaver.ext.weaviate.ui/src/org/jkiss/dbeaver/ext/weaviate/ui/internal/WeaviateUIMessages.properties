query_options=Search options
query_server_default=(server default)
query_consistency=Read from:
query_consistency_tip=How many replicas must answer before the read returns. Shown only on a collection with more than one replica per shard, since with one every level is the same read. Left unset the server chooses.
query_operator=Match words:
query_operator_tip=How the query's words are combined. "All words" needs every word in one property; "across properties" lets them be spread over several. Keyword search only -- a vector search has no words to combine. Left unset the server chooses, and may choose differently between versions.
query_operator_minimum=Minimum words:
query_operator_minimum_tip=How many of the query's words must match. Read only by "At least N words".
query_options_no_consistency=Read from: not shown -- every shard of this collection has one copy, so every consistency level is the same read.
query_options_no_operator=Match words: not shown -- only a keyword search (BM25 or Hybrid) has words to combine.
query_options_no_diversity=Diversify results: not shown -- only a vector-ranked search (Hybrid or Near ...) ranks by distance.
query_diversify=Diversify results (MMR)
query_diversify_tip=Re-pick the results so they differ from each other instead of returning near-duplicates. The row limit is the candidate pool: MMR chooses from the rows the read would have fetched, so it can only do something when the read fetches more rows than MMR returns.
query_diversify_limit=Return:
query_diversify_limit_tip=How many results to return after diversifying. Must be no larger than the row limit; the server refuses otherwise.
query_diversify_balance=Balance:
query_diversify_balance_tip=0 for maximum diversity, 1 for pure relevance. At 1 the results are the ones the search would have returned anyway.
query_profile_enable=Query profile
query_boost=Boost
query_boost_tip=Nudge the ranking after the search has scored it. Applies to every mode -- the client takes a boost on the shared query options, not on one operator. The client's filter and blend kinds are not offered here: each needs a nested builder rather than a row of inputs.
query_boost_kind=Boost by:
query_boost_none=(no boost)
query_boost_property=Property:
query_boost_property_tip=The property the boost reads. Editable, so a property the panel has not loaded can still be named. "Near a date" needs a date property; the server refuses any other type and says which.
query_boost_modifier=Flatten with:
query_boost_modifier_tip=Compresses the property's range before it boosts. Without one, a property spanning orders of magnitude swamps the relevance score it is meant to nudge.
query_boost_origin=Origin:
query_boost_origin_tip=The value documents are rewarded for sitting near. Required for "Near a number"; for "Near a date" leaving it empty means now.
query_boost_scale=Scale:
query_boost_scale_tip=How far from the origin the reward has faded. Required by both decay kinds: a number, or a duration such as 30d for a date.
query_boost_offset=Offset:
query_boost_offset_tip=A band around the origin that is not penalised at all. Optional.
query_boost_curve=Falloff:
query_boost_weight=Weight:
query_boost_weight_tip=How far the boost may move the ranking, between 0 and 1 -- a blend fraction, not a multiplier. At 0 the ranking is exactly what the search produced; at 1 the boost dominates it. The server refuses anything outside that range.
query_boost_depth=Re-score top:
query_boost_depth_tip=How many of the top candidates are re-scored. 0 leaves it to the server.
query_profile=Query profile
query_profile_tip=What the server did to answer the last query, one block per shard. Tick "Query profile" above; the server produces one only when asked.
query_profile_none=Not requested. Tick "Query profile" above, then run the query.
query_profile_shard_anonymous=Shard {0}
query_profile_enable_tip=Ask the server for a per-shard breakdown of the work it did, shown in the Query Profile section. Asking is what makes it produce one, so it costs nothing when off.

