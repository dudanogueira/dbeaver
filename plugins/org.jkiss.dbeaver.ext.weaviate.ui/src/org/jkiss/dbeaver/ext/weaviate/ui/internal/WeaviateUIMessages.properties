query_target_weight_required={0} needs a weight for every target vector; "{1}" has none.
query_target_weight_invalid=Invalid weight for target vector "{0}": {1}
query_target_vector_required=Target vector "{0}" needs a query vector to search with.
query_target_vector_invalid=Invalid vector for target "{0}": {1}
