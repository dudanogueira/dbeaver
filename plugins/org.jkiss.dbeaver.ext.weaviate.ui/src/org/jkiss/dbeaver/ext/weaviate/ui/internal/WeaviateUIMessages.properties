query_group_by=Group by
query_group_by_tip=Bucket the matches by a property. Adds a _group column; each group is capped independently of the overall limit.\nWeaviate returns almost no per-object metadata inside a group, so _score, _explainScore, _certainty, _created and _updated are hidden while grouping.\nNear searches keep _distance. A grouped BM25 or Hybrid keeps no ranking metric at all -- the groups are still ordered by their best match, but the number behind that order is not returned.
query_group_property=Property:
query_group_none=(no grouping)
query_group_max_groups=Groups:
query_group_max_groups_tip=How many groups to return at most.
query_group_objects_per_group=Objects per group:
query_group_objects_per_group_tip=How many objects to return within each group.
query_group_stats=Show group statistics
query_group_stats_tip=Add the group's object count and distance range as columns. They repeat on every row of a group.
query_group_unavailable=Grouping needs a ranked query. Pick BM25, Hybrid or one of the Near modes.
query_include_vector=Include vectors
query_include_vector_tip=Return embeddings as extra columns. Follows the connection setting (on by default) until changed here.
