query_alpha_tip=Blend between the two search styles: 0 uses BM25 keyword matching only, 1 uses vector similarity only, 0.5 weighs them equally.

query_autocut=Autocut
query_autocut_tip=Keep only the first N groups of results, cutting where the score or distance jumps rather than at a fixed row count. 0 disables it.
query_generative=Generative
query_generative_tip=Generate text with the collection's generative module (or a provider chosen below) as part of the query: a single prompt runs once per object, a grouped task once over the whole result set.
query_generative_single=Single prompt:
query_generative_single_hint=Summarize {title} in one sentence  (runs per object; {property} interpolates)
query_generative_grouped=Grouped task:
query_generative_grouped_hint=What do these results have in common?  (runs once over the whole result set)
query_generative_properties=Task properties:
query_generative_properties_tip=Properties handed to the grouped task. Empty means all of them. The single prompt names its properties inline instead.
query_generative_provider=Provider:
query_generative_provider_none=(no generation)
query_generative_provider_default=(collection default: {0})
query_generative_provider_default_none=(collection default)
query_generative_model=Model:
query_generative_temperature=Temperature:
query_generative_max_tokens=Max tokens:
query_generative_metadata=Return generative metadata
query_generative_metadata_tip=Ask the provider for usage metadata (token counts), shown in a _generativeMeta column beside the generated text.
query_generative_grouped_result=Grouped result:
query_generative_props_without_grouped=Task properties only apply to a grouped task -- add one, or clear the selection.
query_generative_invalid_temperature=Invalid temperature: {0}
query_generative_invalid_max_tokens=Invalid max tokens: {0}
query_rerank=Rerank
query_rerank_tip=Reorder the results with the collection's reranker module, ranking each object's chosen property against the query. The score appears in a _rerankScore column. Near_* searches only -- a limit of the bundled client, not of Weaviate.
query_rerank_property=Property:
query_rerank_none=(none)
query_rerank_query=Query:
query_rerank_query_hint=empty = rank against the search query
query_rerank_module=Reranker module: {0}
query_rerank_no_module=No reranker module is configured on this collection; a reranked query will fail.
query_rerank_property_required=Rerank needs a property to rank on -- pick one, or collapse the Rerank section.
query_metadata=Return metadata:
query_metadata_created=Created
query_metadata_updated=Updated
query_metadata_certainty=Certainty
query_metadata_tip=Extra per-object metadata to fetch and show as columns. Certainty is the vector distance normalised to [0, 1], so it exists only on the near_* searches.
query_targets=Target vectors
query_targets_tip=Which of this collection's named vectors to search. Leave empty to let the server choose, which only works while the collection has a single vector.
query_target_add=+ Add target
query_target_remove=Remove target vector
query_target_join=Join strategy:
